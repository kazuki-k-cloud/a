services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: koudo_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d koudo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:8080"
    environment:
      DATABASE_URL: "postgresql://app:app@db:5432/koudo_db?schema=public"
      AUTH_SECRET: "dev-secret-change-me-in-production-please-generate-a-real-one"
      NEXTAUTH_URL: "http://localhost:3000"
      AUTH_GOOGLE_ID: ""
      AUTH_GOOGLE_SECRET: ""
      ALLOWED_EMAIL_DOMAINS: "example.com"
      MAIL_PROVIDER: "mock"
      APP_BASE_URL: "http://localhost:3000"
      CRON_SECRET: "dev-cron-secret-change-me"

volumes:
  db_data:
