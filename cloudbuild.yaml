# Cloud Build設定: Dockerイメージのビルド → Artifact Registryへpush
# → Cloud SQLへマイグレーション適用 → Cloud Runへデプロイ
#
# 事前準備（初回のみ、手動 or 別途IaCで）:
#   - Artifact Registryリポジトリの作成
#   - Cloud SQL for PostgreSQLインスタンス・DB・ユーザーの作成
#   - Secret Managerに以下のシークレットを登録:
#       DATABASE_URL              (Cloud Run実行時用。unixソケット経由:
#                                   postgresql://USER:PASSWORD@localhost/DB?host=/cloudsql/INSTANCE_CONNECTION_NAME)
#       DATABASE_URL_MIGRATE      (このCloud Buildのマイグレーション実行用。Cloud SQL Auth Proxy経由:
#                                   postgresql://USER:PASSWORD@cloudsql-proxy:5432/DB?schema=public)
#       AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, CRON_SECRET
#   - Cloud BuildサービスアカウントにSecret Manager Secret Accessor / Cloud SQL Client ロールを付与
#
# 実行例:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_CLOUDSQL_INSTANCE=PROJECT_ID:asia-northeast1:koudo-db,_APP_URL=https://koudo-app-xxxx.a.run.app

steps:
  # 1. Dockerイメージのビルド
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest",
        ".",
      ]

  # 2. Artifact Registryへpush
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "--all-tags",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}",
      ]

  # 3. Cloud SQL Auth Proxyを起動し、prisma migrate deployでマイグレーションを適用
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        docker run -d --name cloudsql-proxy --network cloudbuild \
          gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0 \
          --address 0.0.0.0 --port 5432 ${_CLOUDSQL_INSTANCE}
        sleep 5
        docker run --rm --network cloudbuild \
          -e DATABASE_URL="$$DATABASE_URL_MIGRATE" \
          --entrypoint npx \
          ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA} \
          prisma migrate deploy
        docker stop cloudsql-proxy
    secretEnv: ["DATABASE_URL_MIGRATE"]

  # 4. Cloud Runへデプロイ
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --set-env-vars=NEXTAUTH_URL=${_APP_URL},APP_BASE_URL=${_APP_URL},ALLOWED_EMAIL_DOMAINS=${_ALLOWED_EMAIL_DOMAINS},MAIL_PROVIDER=mock
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,AUTH_SECRET=AUTH_SECRET:latest,AUTH_GOOGLE_ID=AUTH_GOOGLE_ID:latest,AUTH_GOOGLE_SECRET=AUTH_GOOGLE_SECRET:latest,CRON_SECRET=CRON_SECRET:latest
      - --min-instances=0
      - --max-instances=3
      - --memory=512Mi
      - --allow-unauthenticated

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest"

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/DATABASE_URL_MIGRATE/versions/latest
      env: "DATABASE_URL_MIGRATE"

substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: koudo-app
  _SERVICE: koudo-app
  _CLOUDSQL_INSTANCE: PROJECT_ID:asia-northeast1:koudo-db
  _APP_URL: https://example.com
  _ALLOWED_EMAIL_DOMAINS: example.com

options:
  logging: CLOUD_LOGGING_ONLY
